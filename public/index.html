<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT Study — 日本語学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard-jp@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<style>
  /* ── Dark theme (default) ── */
  :root, [data-theme="dark"] {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #16161f;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #e8e8f0;
    --text-muted: #6b6b85;
    --text-dim: #3a3a55;
    --accent: #7c6dfa;
    --accent2: #fa6d9e;
    --accent3: #6dfabd;
    --accent4: #fabd6d;
    --n1: #ff6b6b;
    --n2: #ff9f43;
    --n3: #ffd166;
    --n4: #06d6a0;
    --glow-purple: 0 0 40px rgba(124,109,250,0.15);
    --grid-line: rgba(124,109,250,0.03);
    --blob-opacity: 0.12;
    --card-shadow: none;
    --theme-icon: "☀️";
    --radius: 16px;
    --radius-sm: 10px;
  }

  /* ── Light theme ── */
  [data-theme="light"] {
    --bg: #f4f4f8;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.18);
    --text: #18181f;
    --text-muted: #7070a0;
    --text-dim: #b0b0cc;
    --accent: #5b4ef0;
    --accent2: #e83e8c;
    --accent3: #00b877;
    --accent4: #e09000;
    --n1: #e03030;
    --n2: #e07000;
    --n3: #c09000;
    --n4: #008855;
    --glow-purple: 0 4px 24px rgba(91,78,240,0.12);
    --grid-line: rgba(91,78,240,0.04);
    --blob-opacity: 0.07;
    --card-shadow: 0 2px 16px rgba(0,0,0,0.07);
    --theme-icon: "🌙";
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { transition: background 0.35s, color 0.35s; }

  body {
    font-family: "Pretendard JP Variable", "Pretendard JP", 'Noto Serif JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.35s, color 0.35s;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.35s;
  }

  /* Ambient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: var(--blob-opacity);
    pointer-events: none;
    z-index: 0;
    animation: blobFloat 12s ease-in-out infinite;
    transition: opacity 0.35s;
  }
  .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; }
  .blob-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -50px; animation-delay: -6s; }
  .blob-3 { width: 300px; height: 300px; background: var(--accent3); top: 50%; left: 50%; animation-delay: -3s; }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  /* Layout */
  .app { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 24px 80px; }

  /* Header */
  header {
    padding: 40px 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .logo-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 28px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.05em;
  }

  .logo-en {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  /* Theme Toggle */
  .theme-toggle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.25s;
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    border-color: var(--border-hover);
    transform: scale(1.08) rotate(15deg);
    box-shadow: var(--card-shadow);
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.35s, border-color 0.35s;
  }

  .stat-pill strong { color: var(--text); font-size: 14px; }

  /* Level Selector */
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .level-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: var(--card-shadow);
  }

  .level-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .level-btn:hover { transform: translateY(-2px); }

  .level-btn.active {
    border-color: transparent;
    box-shadow: 0 0 0 1px var(--level-color), var(--glow-purple);
  }

  .level-btn.active::before { opacity: 0.08; background: var(--level-color); }

  .level-btn[data-level="N1"] { --level-color: var(--n1); }
  .level-btn[data-level="N2"] { --level-color: var(--n2); }
  .level-btn[data-level="N3"] { --level-color: var(--n3); }
  .level-btn[data-level="N4"] { --level-color: var(--n4); }

  .level-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--level-color);
    margin-bottom: 4px;
  }

  .level-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .level-count {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* Main card area */
  .main-area {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
  }

  /* Word Card */
  .word-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    position: relative;
    overflow: hidden;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.3s, background 0.35s, box-shadow 0.35s;
    box-shadow: var(--card-shadow);
  }

  .word-card.loading {
    justify-content: center;
    align-items: center;
  }

  .word-card-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 30%, rgba(124,109,250,0.06), transparent 70%);
    pointer-events: none;
  }

  .word-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .word-level-badge {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--level-color, var(--accent));
  }

  .word-type-badge {
    background: rgba(124,109,250,0.1);
    border: 1px solid rgba(124,109,250,0.2);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--accent);
  }

  .word-main {
    text-align: center;
    padding: 24px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .word-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 64px;
    font-weight: 600;
    line-height: 1.1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: wordReveal 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes wordReveal {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .word-reading {
    font-size: 18px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 300;
    animation: wordReveal 0.5s 0.1s both cubic-bezier(0.4, 0, 0.2, 1);
  }

  .word-meaning {
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 12px;
    animation: wordReveal 0.5s 0.15s both cubic-bezier(0.4, 0, 0.2, 1);
  }

  .word-meaning-en {
    font-size: 14px;
    color: var(--text-muted);
    animation: wordReveal 0.5s 0.2s both cubic-bezier(0.4, 0, 0.2, 1);
  }

  .word-example {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-top: 8px;
    animation: wordReveal 0.5s 0.25s both cubic-bezier(0.4, 0, 0.2, 1);
  }

  .word-example-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .word-example-jp {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 4px;
    font-family: 'Noto Serif JP', serif;
  }

  .word-example-kr {
    font-size: 12px;
    color: var(--text-muted);
  }

  .word-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 22px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b8bff);
    color: white;
    box-shadow: 0 4px 20px rgba(124,109,250,0.35);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 25px rgba(124,109,250,0.45);
  }

  .btn-save {
    background: rgba(6,214,160,0.1);
    border: 1px solid rgba(6,214,160,0.25);
    color: var(--accent3);
  }

  .btn-save:hover { background: rgba(6,214,160,0.18); }
  .btn-save.saved { background: rgba(6,214,160,0.2); border-color: var(--accent3); }

  .btn-ghost {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    box-shadow: var(--card-shadow);
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-title {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .sidebar-count {
    font-size: 11px;
    background: rgba(124,109,250,0.15);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 100px;
  }

  .saved-list {
    max-height: 360px;
    overflow-y: auto;
    padding: 8px;
  }

  .saved-list::-webkit-scrollbar { width: 4px; }
  .saved-list::-webkit-scrollbar-track { background: transparent; }
  .saved-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .saved-item {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s;
    gap: 10px;
  }

  .saved-item:hover { background: var(--surface2); }

  .saved-item-left { flex: 1; min-width: 0; }

  .saved-item-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .saved-item-reading {
    font-size: 11px;
    color: var(--text-muted);
  }

  .saved-item-meaning {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100px;
  }

  .saved-item-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.15s;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: var(--n1); }

  .empty-state {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.8;
  }

  /* Quiz mode */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    box-shadow: var(--card-shadow);
  }

  .quiz-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .quiz-progress {
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
  }

  .quiz-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .quiz-body { padding: 20px; }

  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .quiz-option {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    transition: all 0.2s;
    text-align: center;
  }

  .quiz-option:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
  .quiz-option.correct { background: rgba(6,214,160,0.15); border-color: var(--accent3); color: var(--accent3); }
  .quiz-option.wrong { background: rgba(255,107,107,0.15); border-color: var(--n1); color: var(--n1); }

  /* Loading */
  .loader {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .loader-dots {
    display: flex;
    gap: 6px;
  }

  .loader-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
  }

  .loader-dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
  .loader-dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent3); }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  .loader-text {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Notification */
  .notification {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 12px 24px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s;
    z-index: 100;
    white-space: nowrap;
    backdrop-filter: blur(12px);
    box-shadow: var(--card-shadow);
  }

  .notification.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Tags */
  .mode-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 100px;
    padding: 4px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    transition: background 0.35s, border-color 0.35s;
  }

  .mode-tab {
    flex: 1;
    padding: 9px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .mode-tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Responsive */
  @media (max-width: 720px) {
    .main-area { grid-template-columns: 1fr; }
    .level-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .word-kanji { font-size: 48px; }
    .header-stats { display: none; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div id="notification" class="notification"></div>

<div class="app">
  <header>
    <div class="logo">
      <span class="logo-jp">日本語</span>
      <span class="logo-en">JLPT Study</span>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        저장된 단어 <strong id="total-saved">0</strong>
      </div>
      <div class="stat-pill">
        학습 세션 <strong id="session-count">0</strong>
      </div>
      <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="테마 변경">☀️</button>
    </div>
  </header>

  <!-- Level Selector -->
  <div class="section-label">난이도 선택</div>
  <div class="level-grid">
    <button class="level-btn active" data-level="N1" onclick="selectLevel('N1')">
      <div class="level-name">N1</div>
      <div class="level-desc">최상급<br>고급 문법</div>
      <div class="level-count">約2000語</div>
    </button>
    <button class="level-btn" data-level="N2" onclick="selectLevel('N2')">
      <div class="level-name">N2</div>
      <div class="level-desc">상급<br>일상 회화</div>
      <div class="level-count">約1000語</div>
    </button>
    <button class="level-btn" data-level="N3" onclick="selectLevel('N3')">
      <div class="level-name">N3</div>
      <div class="level-desc">중급<br>기본 문장</div>
      <div class="level-count">約650語</div>
    </button>
    <button class="level-btn" data-level="N4" onclick="selectLevel('N4')">
      <div class="level-name">N4</div>
      <div class="level-desc">초급<br>기초 단어</div>
      <div class="level-count">約300語</div>
    </button>
  </div>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('study')" id="tab-study">단어 학습</button>
    <button class="mode-tab" onclick="setMode('quiz')" id="tab-quiz">퀴즈 모드</button>
    <button class="mode-tab" onclick="setMode('saved')" id="tab-saved">저장 목록</button>
  </div>

  <!-- Main Area -->
  <div class="main-area">
    <!-- Left: Word Card / Quiz / Saved List -->
    <div id="mode-content">
      <!-- Study Mode -->
      <div id="mode-study">
        <div class="word-card" id="word-card">
          <div class="word-card-glow"></div>
          <div class="loader">
            <div class="loader-dots">
              <div class="loader-dot"></div>
              <div class="loader-dot"></div>
              <div class="loader-dot"></div>
            </div>
            <div class="loader-text">레벨을 선택하고 시작하세요</div>
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn btn-primary" onclick="generateWord()" style="flex:1;">
            <span>⟳</span> 새 단어 생성
          </button>
          <button class="btn btn-ghost" onclick="toggleExample()" id="btn-example" style="display:none">
            예문 보기
          </button>
        </div>
      </div>

      <!-- Quiz Mode -->
      <div id="mode-quiz" style="display:none">
        <div class="quiz-card">
          <div class="quiz-header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="sidebar-title">퀴즈 모드 — <span id="quiz-level-label">N1</span></span>
              <span style="font-size:12px; color:var(--text-muted)"><span id="quiz-score">0</span> / <span id="quiz-total">0</span> 정답</span>
            </div>
            <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-bar" style="width:0%"></div></div>
          </div>
          <div class="quiz-body" id="quiz-body">
            <div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px 0;">
              퀴즈를 시작하려면 아래 버튼을 누르세요
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()" style="width:100%; margin-top:14px; justify-content:center;">
          퀴즈 시작
        </button>
      </div>

      <!-- Saved Full View -->
      <div id="mode-saved" style="display:none">
        <div class="sidebar-card">
          <div class="sidebar-header">
            <span class="sidebar-title">저장된 단어</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <span class="sidebar-count" id="saved-count-big">0개</span>
              <button class="btn btn-ghost" onclick="clearAll()" style="padding:5px 12px;font-size:11px;">전체 삭제</button>
            </div>
          </div>
          <div id="saved-full-list" style="padding:8px; max-height:500px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="sidebar">
      <!-- Recent Saved -->
      <div class="sidebar-card">
        <div class="sidebar-header">
          <span class="sidebar-title">최근 저장</span>
          <span class="sidebar-count" id="saved-count">0</span>
        </div>
        <div class="saved-list" id="saved-list">
          <div class="empty-state">
            저장된 단어가 없어요.<br>단어를 학습하고 ★ 버튼으로<br>저장해보세요!
          </div>
        </div>
      </div>

      <!-- Tips -->
      <div class="sidebar-card">
        <div class="sidebar-header">
          <span class="sidebar-title">학습 팁</span>
        </div>
        <div style="padding:16px 20px; font-size:12px; color:var(--text-muted); line-height:1.8;" id="study-tip">
          단어를 저장하고 퀴즈 모드에서 복습해보세요. 반복 학습이 기억력을 높입니다.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Theme
let currentTheme = localStorage.getItem('jlpt-theme') || 'dark';
applyTheme(currentTheme);

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  currentTheme = theme;
  localStorage.setItem('jlpt-theme', theme);
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// State
let currentLevel = 'N1';
let currentWord = null;
let savedWords = JSON.parse(localStorage.getItem('jlpt-saved') || '[]');
let sessionCount = parseInt(localStorage.getItem('jlpt-session') || '0');
let showingExample = false;
let currentMode = 'study';
let quizWords = [];
let quizIndex = 0;
let quizScore = 0;

// Init
updateStats();
renderSaved();

const tips = {
  N1: "N1은 추상적 주제와 복잡한 문장 구조를 다뤄요. 신문과 문학 작품 읽기를 병행하세요.",
  N2: "N2는 일상적 상황의 고급 표현이 중요해요. 드라마 대본을 활용한 학습이 효과적입니다.",
  N3: "N3는 기본 회화에서 자연스럽게 표현할 수 있는 수준이에요. 플래시카드로 반복 학습하세요.",
  N4: "N4는 기초 단어와 기본 문법에 집중하세요. 히라가나와 가타카나를 완벽히 익히는 것이 중요해요."
};

function selectLevel(level) {
  currentLevel = level;
  document.querySelectorAll('.level-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.level === level);
  });
  document.getElementById('study-tip').textContent = tips[level];
  document.getElementById('quiz-level-label').textContent = level;
  currentWord = null;
  showingExample = false;
  document.getElementById('btn-example').style.display = 'none';
  renderWordCard(null);
  showNotif(`${level} 레벨로 전환했어요`);
}

function setMode(mode) {
  currentMode = mode;
  ['study', 'quiz', 'saved'].forEach(m => {
    document.getElementById(`mode-${m}`).style.display = m === mode ? 'block' : 'none';
    document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
  });
  if (mode === 'saved') renderSavedFull();
}

async function generateWord() {
  sessionCount++;
  localStorage.setItem('jlpt-session', sessionCount);
  document.getElementById('session-count').textContent = sessionCount;
  showingExample = false;

  const card = document.getElementById('word-card');
  card.innerHTML = `<div class="word-card-glow"></div><div class="loader"><div class="loader-dots"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div><div class="loader-text">단어 생성 중...</div></div>`;
  card.classList.add('loading');
  document.getElementById('btn-example').style.display = 'none';

  try {
    const resp = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level: currentLevel })
    });

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'API error');
    currentWord = data;
    renderWordCard(currentWord);
    document.getElementById('btn-example').style.display = 'inline-flex';
  } catch(e) {
    card.classList.remove('loading');
    card.innerHTML = `<div class="word-card-glow"></div><div style="text-align:center; color:var(--text-muted); padding:40px 0;">⚠️ 단어 생성에 실패했습니다.<br><small style="color:var(--text-dim)">다시 시도해주세요</small></div>`;
  }
}

function renderWordCard(word) {
  const card = document.getElementById('word-card');
  card.classList.remove('loading');

  if (!word) {
    card.innerHTML = `<div class="word-card-glow"></div><div class="loader"><div class="loader-dots"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div><div class="loader-text">레벨을 선택하고 단어를 생성하세요</div></div>`;
    return;
  }

  const levelColors = { N1: 'var(--n1)', N2: 'var(--n2)', N3: 'var(--n3)', N4: 'var(--n4)' };
  const isSaved = savedWords.some(w => w.kanji === word.kanji);

  card.innerHTML = `
    <div class="word-card-glow"></div>
    <div class="word-top">
      <span class="word-level-badge" style="--level-color:${levelColors[word.level]}">${word.level}</span>
      <span class="word-type-badge">${word.type}</span>
    </div>
    <div class="word-main">
      <div class="word-kanji">${word.kanji}</div>
      <div class="word-reading">${word.reading}</div>
      <div class="word-meaning">${word.meaning_kr}</div>
      <div class="word-meaning-en">${word.meaning_en}</div>
      ${showingExample ? `
      <div class="word-example">
        <div class="word-example-label">例文 Example</div>
        <div class="word-example-jp">${word.example_jp}</div>
        <div class="word-example-kr">${word.example_kr}</div>
      </div>
      ${word.memory_tip ? `<div style="margin-top:12px; font-size:12px; color:var(--accent); background:rgba(124,109,250,0.08); border:1px solid rgba(124,109,250,0.15); border-radius:8px; padding:10px 14px;">💡 ${word.memory_tip}</div>` : ''}
      ` : ''}
    </div>
    <div class="word-actions">
      <button class="btn btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave()">
        ${isSaved ? '★ 저장됨' : '☆ 저장하기'}
      </button>
    </div>
  `;
}

function toggleExample() {
  if (!currentWord) return;
  showingExample = !showingExample;
  const btn = document.getElementById('btn-example');
  btn.textContent = showingExample ? '예문 숨기기' : '예문 보기';
  renderWordCard(currentWord);
}

function toggleSave() {
  if (!currentWord) return;
  const idx = savedWords.findIndex(w => w.kanji === currentWord.kanji);
  if (idx >= 0) {
    savedWords.splice(idx, 1);
    showNotif(`'${currentWord.kanji}' 저장 취소`);
  } else {
    savedWords.unshift({ ...currentWord, savedAt: Date.now() });
    showNotif(`'${currentWord.kanji}' 저장 완료! ★`);
  }
  localStorage.setItem('jlpt-saved', JSON.stringify(savedWords));
  updateStats();
  renderSaved();
  renderWordCard(currentWord);
}

function renderSaved() {
  const list = document.getElementById('saved-list');
  const count = document.getElementById('saved-count');
  count.textContent = savedWords.length;
  document.getElementById('total-saved').textContent = savedWords.length;

  if (savedWords.length === 0) {
    list.innerHTML = `<div class="empty-state">저장된 단어가 없어요.<br>단어를 학습하고 ★ 버튼으로<br>저장해보세요!</div>`;
    return;
  }

  const levelColors = { N1: 'var(--n1)', N2: 'var(--n2)', N3: 'var(--n3)', N4: 'var(--n4)' };
  list.innerHTML = savedWords.slice(0, 8).map(w => `
    <div class="saved-item" onclick="showSavedWord('${w.kanji}')">
      <div class="saved-item-left">
        <div class="saved-item-kanji">${w.kanji}</div>
        <div class="saved-item-reading">${w.reading}</div>
      </div>
      <div class="saved-item-meaning">${w.meaning_kr}</div>
      <span class="saved-item-badge" style="background:rgba(0,0,0,0.3); color:${levelColors[w.level]}">${w.level}</span>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteWord('${w.kanji}')">✕</button>
    </div>
  `).join('');
}

function renderSavedFull() {
  const list = document.getElementById('saved-full-list');
  document.getElementById('saved-count-big').textContent = `${savedWords.length}개`;

  if (savedWords.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding:40px;">저장된 단어가 없어요</div>`;
    return;
  }

  const levelColors = { N1: 'var(--n1)', N2: 'var(--n2)', N3: 'var(--n3)', N4: 'var(--n4)' };
  list.innerHTML = savedWords.map(w => `
    <div class="saved-item" onclick="showSavedWord('${w.kanji}')">
      <div class="saved-item-left">
        <div class="saved-item-kanji">${w.kanji}</div>
        <div class="saved-item-reading">${w.reading} · ${w.type}</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${w.meaning_kr}</div>
      </div>
      <span class="saved-item-badge" style="background:rgba(0,0,0,0.3); color:${levelColors[w.level]}">${w.level}</span>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteWord('${w.kanji}'); renderSavedFull();">✕</button>
    </div>
  `).join('');
}

function showSavedWord(kanji) {
  const word = savedWords.find(w => w.kanji === kanji);
  if (!word) return;
  setMode('study');
  currentWord = word;
  currentLevel = word.level;
  showingExample = false;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.toggle('active', b.dataset.level === word.level));
  renderWordCard(word);
  document.getElementById('btn-example').style.display = 'inline-flex';
}

function deleteWord(kanji) {
  savedWords = savedWords.filter(w => w.kanji !== kanji);
  localStorage.setItem('jlpt-saved', JSON.stringify(savedWords));
  updateStats();
  renderSaved();
  showNotif('단어 삭제됨');
}

function clearAll() {
  if (confirm('저장된 모든 단어를 삭제할까요?')) {
    savedWords = [];
    localStorage.setItem('jlpt-saved', JSON.stringify(savedWords));
    updateStats();
    renderSaved();
    renderSavedFull();
    showNotif('전체 삭제 완료');
  }
}

function updateStats() {
  document.getElementById('total-saved').textContent = savedWords.length;
  document.getElementById('session-count').textContent = sessionCount;
}

// Quiz Mode
async function startQuiz() {
  if (savedWords.length < 2) {
    showNotif('퀴즈를 위해 최소 2개의 단어를 저장하세요');
    return;
  }

  quizWords = [...savedWords].sort(() => Math.random() - 0.5).slice(0, Math.min(savedWords.length, 10));
  quizIndex = 0;
  quizScore = 0;
  renderQuiz();
}

function renderQuiz() {
  if (quizIndex >= quizWords.length) {
    const pct = Math.round((quizScore / quizWords.length) * 100);
    document.getElementById('quiz-body').innerHTML = `
      <div style="text-align:center; padding:20px 0;">
        <div style="font-size:48px; margin-bottom:12px;">${pct >= 80 ? '🎉' : pct >= 50 ? '😊' : '💪'}</div>
        <div style="font-size:22px; font-weight:600; margin-bottom:8px;">${quizScore} / ${quizWords.length} 정답</div>
        <div style="font-size:13px; color:var(--text-muted);">${pct}% 정확도</div>
      </div>
    `;
    document.getElementById('quiz-bar').style.width = '100%';
    return;
  }

  const word = quizWords[quizIndex];
  const progress = (quizIndex / quizWords.length) * 100;
  document.getElementById('quiz-bar').style.width = `${progress}%`;
  document.getElementById('quiz-score').textContent = quizScore;
  document.getElementById('quiz-total').textContent = quizIndex;

  // Generate wrong options from other saved words
  const others = savedWords.filter(w => w.kanji !== word.kanji);
  const wrongs = others.sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.meaning_kr);
  const options = [word.meaning_kr, ...wrongs].sort(() => Math.random() - 0.5);

  document.getElementById('quiz-body').innerHTML = `
    <div style="text-align:center; margin-bottom:16px;">
      <div style="font-size:36px; font-family:'Noto Serif JP',serif; margin-bottom:6px;">${word.kanji}</div>
      <div style="font-size:14px; color:var(--text-muted);">${word.reading}</div>
    </div>
    <div style="font-size:11px; color:var(--text-dim); text-align:center; margin-bottom:12px; letter-spacing:0.1em;">뜻을 선택하세요</div>
    <div class="quiz-options">
      ${options.map(opt => `<button class="quiz-option" onclick="checkAnswer(this, '${opt.replace(/'/g,"\\'")}', '${word.meaning_kr.replace(/'/g,"\\'")}', '${word.kanji}')">${opt}</button>`).join('')}
    </div>
  `;
}

function checkAnswer(btn, selected, correct, kanji) {
  document.querySelectorAll('.quiz-option').forEach(b => b.onclick = null);

  if (selected === correct) {
    btn.classList.add('correct');
    quizScore++;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-option').forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
  }

  quizIndex++;
  document.getElementById('quiz-score').textContent = quizScore;
  document.getElementById('quiz-total').textContent = quizIndex;

  setTimeout(renderQuiz, 1000);
}

// Notification
let notifTimeout;
function showNotif(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(notifTimeout);
  notifTimeout = setTimeout(() => el.classList.remove('show'), 2000);
}
</script>
</body>
</html>
